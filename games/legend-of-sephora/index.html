<title>The Legend of Sephora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: a full-bleed pixel-art island canvas; chunky royal-blue and gold arena chrome pinned to the corners,
   with bottom sheets for orders. One committed look (sea at dusk), not theme-switched. */
:root {
  --ink: #0e1424;
  --royal: #2d5fd3; --royal-hi: #5a8ef5; --royal-lo: #18357f; --royal-deep: #10255a;
  --gold: #ffc83a; --gold-hi: #ffe27a; --gold-lo: #b97a0c;
  --leaf: #66cc33; --leaf-hi: #9be65c; --leaf-lo: #357d17;
  --ember: #ec4636; --ember-lo: #93201a;
  --paper: #fff5da; --card: #fff8e6; --card-lo: #efdfb8; --mist: #b9cbf2; --sea: #1c6780;
  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--sea); color: var(--paper); font: 700 15px/1.35 var(--f-body); overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }
#overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.outline { color: #fff; text-shadow: 0 -2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink),
  2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 4px 0 var(--ink); }
.outline-sm { color: #fff; text-shadow: 0 -1.5px 0 var(--ink), 1.5px 0 0 var(--ink), -1.5px 0 0 var(--ink), 0 1.5px 0 var(--ink),
  1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 0 3px 0 var(--ink); }
.muted { color: var(--mist); font-weight: 700; }
:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 2px; }

/* ---------- buttons ---------- */
.btn { --b1: var(--leaf-hi); --b2: var(--leaf); --b3: var(--leaf-lo);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--f-display); font-size: 17px;
  letter-spacing: .02em; color: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 8px 16px; cursor: pointer;
  background: linear-gradient(180deg, var(--b1) 0 48%, var(--b2) 48%);
  box-shadow: inset 0 -4px 0 var(--b3), inset 0 2px 0 rgba(255,255,255,.35), 0 3px 0 var(--ink);
  text-shadow: 0 2px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 -1px 0 var(--ink); transition: transform .06s; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -2px 0 var(--b3), 0 1px 0 var(--ink); }
.btn.gold { --b1: var(--gold-hi); --b2: var(--gold); --b3: var(--gold-lo); }
.btn.blue { --b1: var(--royal-hi); --b2: var(--royal); --b3: var(--royal-lo); }
.btn.red { --b1: #ff7d6b; --b2: var(--ember); --b3: var(--ember-lo); }
.btn.grey, .btn:disabled { --b1: #a7aebb; --b2: #8a92a1; --b3: #5d6473; cursor: not-allowed; }
.btn.small { font-size: 14px; padding: 5px 10px; border-radius: 10px; }
.btn.big { font-size: 26px; padding: 12px 34px; border-radius: 16px; }
.btn .price { margin-left: 2px; }
.price { display: inline-flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.price img { width: 20px; height: 20px; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; font: 400 20px var(--f-display); color: #fff; cursor: pointer;
  background: linear-gradient(180deg, var(--royal-hi) 0 50%, var(--royal) 50%); border: 3px solid var(--ink); border-radius: 10px;
  box-shadow: inset 0 -3px 0 var(--royal-lo), 0 2px 0 var(--ink); text-shadow: 0 2px 0 var(--ink); }

/* ---------- panels ---------- */
.panel { background: linear-gradient(180deg, var(--royal-hi) 0, var(--royal) 34px, var(--royal-lo) 100%);
  border: 3px solid var(--ink); border-radius: 18px; box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 6px 0 rgba(0,0,0,.35); }
.tabs { display: flex; gap: 6px; padding: 0 12px; flex-wrap: wrap; }
.tab { font: 400 16px var(--f-display); color: #fff; padding: 7px 14px; border: 3px solid var(--ink); border-radius: 12px 12px 0 0;
  background: var(--royal-deep); cursor: pointer; text-shadow: 0 2px 0 var(--ink); margin-bottom: -3px; }
.tab.on { background: var(--gold); color: #fff; }

/* ---------- menu ---------- */
.screen { position: fixed; inset: 0; z-index: 30; overflow: auto; display: flex; justify-content: center; align-items: flex-start;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  background: radial-gradient(ellipse at 50% 35%, rgba(8,20,48,0) 0%, rgba(8,20,48,.5) 75%); user-select: none; }
.menu-inner { width: min(900px, 100%); display: flex; flex-direction: column; gap: 14px; margin: auto 0; }
.logo { margin: 0; text-align: center; font: 400 clamp(46px, 10vw, 92px)/.86 var(--f-display); letter-spacing: .01em; }
.logo .l1 { display: block; color: var(--gold); text-shadow: 0 -3px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink),
  3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 7px 0 var(--ink), 0 10px 16px rgba(0,0,0,.4); }
.logo .l0 { display: block; font-size: .36em; letter-spacing: .14em; text-transform: uppercase; margin-bottom: .12em; }
.tagline { margin: 0; text-align: center; font-size: 15px; text-wrap: balance; }
.menu-grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 14px; }
.menu-card { padding: 12px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.card-head { font: 400 20px var(--f-display); margin: 0; }
.hero-stage { display: grid; place-items: center; background: radial-gradient(circle at 50% 75%, #7cc74a 0 30%, #4f9a35 31% 45%, transparent 46%), linear-gradient(#8fd0ff, #cfeeff);
  border: 3px solid var(--ink); border-radius: 14px; height: 168px; }
#preview { width: 192px; height: 150px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field-label { font: 400 14px var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.text-input { flex: 1; min-width: 0; font: 800 17px var(--f-body); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 7px 10px; user-select: text; }
.custom-body { background: rgba(8,18,46,.45); border: 3px solid var(--ink); border-radius: 0 12px 12px 12px; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 180px; }
.opt-row { display: flex; flex-direction: column; gap: 6px; }
.opt-label { font: 400 14px var(--f-display); letter-spacing: .05em; text-transform: uppercase; color: var(--gold-hi); }
.opt-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 36px; height: 36px; border-radius: 9px; border: 3px solid var(--ink); background: var(--c); cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
.swatch.on, .opt.on { outline: 3px solid var(--gold); outline-offset: 2px; }
.opt { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 6px 3px; min-width: 56px; border: 3px solid var(--ink); border-radius: 10px;
  background: #e8efff; color: var(--ink); font: 900 11px var(--f-body); cursor: pointer; }
.opt img { width: 32px; height: 32px; }
.menu-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
.seed { display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; background: rgba(8,18,46,.6); border: 3px solid var(--ink); border-radius: 999px; font: 400 16px var(--f-display); }
.continue { display: inline-flex; flex-direction: column; line-height: 1.05; }
.continue small { font: 800 12px var(--f-body); text-shadow: 0 1px 0 var(--ink); }
.ai-line { text-align: center; font-size: 13px; color: var(--mist); }
.confirm { padding: 12px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; text-align: center; }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud-top { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; }
.hud-left { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; min-width: 0; max-width: 300px; }
.profile { display: flex; gap: 8px; align-items: center; padding: 4px 12px 6px 4px; border-radius: 14px; }
.profile > img { width: 44px; height: 44px; background: #8fd0ff; border: 3px solid var(--ink); border-radius: 10px; }
.profile-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
#hud-name { font: 400 18px var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvl { display: flex; align-items: center; gap: 4px; font: 400 14px var(--f-display); }
.lvl img { width: 18px; height: 18px; }
.lvl { white-space: nowrap; }
.lvl small { font: 800 11px var(--f-body); color: var(--gold-hi); margin-left: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 10px; background: #1b1f33; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; min-width: 90px; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(var(--gold-hi), var(--gold)); transition: width .2s; }
.bar.hp i { background: linear-gradient(#ff8a7a, var(--ember)); }
.bar.food i { background: linear-gradient(#ffcf8a, #d98a2c); }
.bar.energy i { background: linear-gradient(#8fe8ff, #2bb3d9); }
.bar.low { animation: pulse .8s infinite alternate; }
@keyframes pulse { to { border-color: var(--ember); } }
.hp-row { display: flex; align-items: center; gap: 4px; padding-left: 4px; }
.hp-row img { width: 20px; height: 20px; }
.hp-row .bar { flex: 1; max-width: 160px; }
.quest { display: flex; flex-direction: column; gap: 1px; padding: 6px 10px; border-radius: 12px; border: 3px solid var(--ink); background: rgba(10,18,44,.78); cursor: pointer; max-width: 260px; }
.q-label { font: 400 12px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.q-text { font-size: 14px; line-height: 1.25; }
.q-text b { color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; min-width: 0; }
.res-bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px 0 2px; background: rgba(10,18,44,.82); border: 3px solid var(--ink);
  border-radius: 999px; font: 400 18px var(--f-display); font-variant-numeric: tabular-nums; min-width: 64px; }
.pill img { width: 30px; height: 30px; margin: 0 0 0 -10px; filter: drop-shadow(0 2px 0 var(--ink)); }
.pill.bump { animation: bump .3s; }
@keyframes bump { 40% { transform: scale(1.15); } }
.hud-tools { display: flex; gap: 6px; align-items: center; }
.clock { padding-left: 4px; min-width: 0; white-space: nowrap; }
.clock img { width: 24px; height: 24px; margin: 0; }
#notices { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%); width: min(400px, calc(100% - 640px));
  display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 5; }
@media (max-width: 1000px) { #notices { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); left: 12px; transform: none; width: min(360px, calc(100% - 24px)); flex-direction: column-reverse; } }
.notice { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 3px solid var(--ink); border-radius: 12px; font-size: 14px; line-height: 1.3;
  background: linear-gradient(180deg, var(--royal-hi), var(--royal)); box-shadow: 0 3px 0 rgba(0,0,0,.35); text-shadow: 0 1px 0 var(--ink); animation: drop .3s; }
.notice img { width: 28px; height: 28px; flex: none; }
.notice img.big { width: auto; height: 40px; }
.notice.good { background: linear-gradient(180deg, var(--leaf-hi), var(--leaf-lo)); }
.notice.warn { background: linear-gradient(180deg, #ffcf6a, #d98a1c); }
.notice.danger { background: linear-gradient(180deg, #ff7d6b, var(--ember-lo)); }
.notice .cd { font-family: var(--f-display); font-weight: 400; color: var(--gold-hi); }
.notice.out { opacity: 0; transform: translateY(-6px); transition: .35s; }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } }
.hud-bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
  padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 12px); }
.roster { display: flex; gap: 6px; overflow-x: auto; pointer-events: auto; min-width: 0; padding: 4px 2px; scrollbar-width: none; }
.crew-chip { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 62px; padding: 4px 4px 5px; cursor: pointer;
  background: rgba(10,18,44,.85); border: 3px solid var(--ink); border-radius: 12px; }
.crew-chip img { width: 36px; height: 36px; background: #8fd0ff; border-radius: 8px; border: 2px solid var(--ink); }
.crew-chip.sel { border-color: var(--gold); }
.crew-chip.alert { animation: pulse .7s infinite alternate; }
.crew-name { font: 400 12px var(--f-display); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { display: flex; flex-direction: column; gap: 2px; width: 100%; }
.mini i { display: block; height: 3px; border-radius: 2px; }
.m-food { background: #e39a3a; } .m-energy { background: #2bb3d9; } .m-hp { background: var(--leaf); }
.roster-empty { font-size: 13px; color: var(--mist); padding: 8px 10px; background: rgba(10,18,44,.7); border-radius: 10px; border: 3px solid var(--ink); }
.actions { display: flex; gap: 10px; align-items: flex-end; pointer-events: auto; flex: none; }
.round-btn { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0; cursor: pointer; font: 400 13px var(--f-display); text-shadow: 0 2px 0 var(--ink); touch-action: none;
  background: radial-gradient(circle at 50% 35%, #ff8f7d, var(--ember) 60%, var(--ember-lo)); box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), 0 4px 0 var(--ink); }
.round-btn img { width: 36px; height: 36px; filter: drop-shadow(0 2px 0 var(--ink)); }
.round-btn.blue { background: radial-gradient(circle at 50% 35%, var(--royal-hi), var(--royal) 60%, var(--royal-lo)); width: 66px; height: 66px; }
.round-btn span { max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.round-btn:active { transform: translateY(2px); }
.placement { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); width: min(520px, calc(100% - 32px));
  pointer-events: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; z-index: 6; }
.place-text { font-size: 14px; text-shadow: 0 1px 0 var(--ink); }
.place-text b { font-family: var(--f-display); font-weight: 400; font-size: 17px; color: var(--gold-hi); }
.place-actions { display: flex; gap: 8px; justify-content: flex-end; }
.knocked { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font: 400 44px var(--f-display); background: rgba(80,0,0,.25); }
.big-banner { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%) scale(.6); opacity: 0; text-align: center; pointer-events: none; z-index: 8;
  transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .25s; width: calc(100% - 32px); }
.big-banner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.b-title { font: 400 clamp(38px, 8vw, 64px)/1 var(--f-display); color: var(--gold); text-wrap: balance; }
.big-banner.danger .b-title { color: #ff8a7a; }
.b-sub { font: 400 18px var(--f-display); margin-top: 6px; }

/* ---------- speech bubbles ---------- */
.bubble { position: absolute; left: 0; top: 0; max-width: min(200px, calc(100vw - 24px)); background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; padding: 4px 8px;
  font: 800 12px/1.25 var(--f-body); box-shadow: 0 2px 0 rgba(0,0,0,.35); will-change: transform; text-align: left; }
.bubble b { color: var(--royal); font-weight: 900; }

/* ---------- modal ---------- */
.modal-wrap { position: fixed; inset: 0; background: rgba(6,12,30,.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal { width: min(780px, 100%); max-height: min(88vh, 780px); display: flex; flex-direction: column; overflow: hidden; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 8px 16px; flex-wrap: wrap; }
.modal-head h2 { margin: 0; font: 400 26px var(--f-display); margin-right: auto; }
.modal-res { display: flex; gap: 10px; font: 400 16px var(--f-display); text-shadow: 0 2px 0 var(--ink); flex-wrap: wrap; }
.modal-body { overflow: auto; padding: 14px 14px 18px; background: rgba(8,18,46,.5); border-top: 3px solid var(--ink); flex: 1; min-height: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
.card { background: linear-gradient(180deg, var(--card), var(--card-lo)); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 10px;
  display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
.card.owned { opacity: .8; }
.card-art { height: 70px; display: grid; place-items: center; }
.card-art img { height: 48px; width: auto; max-width: 120px; }
.card-art img[src*="data"] { image-rendering: pixelated; }
.card-title { font: 400 18px var(--f-display); color: var(--royal-lo); }
.card-desc { font-size: 13px; line-height: 1.3; flex: 1; }
.card-note { font-size: 12px; color: #6b5a3a; }
.card .buy { width: 100%; }
.sub-head { font: 400 18px var(--f-display); margin: 16px 0 8px; }
.crew-list, .forge { display: flex; flex-direction: column; gap: 8px; }
.crew-row, .forge-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: rgba(10,18,44,.6); border: 3px solid var(--ink); border-radius: 12px; flex-wrap: wrap; }
.forge-row.on { border-color: var(--gold); }
.crew-row img { width: 40px; height: 40px; background: #8fd0ff; border: 2px solid var(--ink); border-radius: 8px; }
.forge-row img.wpn { width: 48px; height: 48px; }
.crew-info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.crew-info b { font: 400 17px var(--f-display); }
.crew-info span { font-size: 13px; color: var(--mist); }
.forge-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font: 400 14px var(--f-display); color: var(--gold-hi); padding: 4px 8px; border: 2px solid var(--gold); border-radius: 8px; }
.div-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.div-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 4px; background: rgba(10,18,44,.7); border: 2px solid var(--ink); border-radius: 999px; font-size: 13px; }
.div-chip img { width: 22px; height: 22px; }
.div-chip b { font-family: var(--f-display); font-weight: 400; color: var(--gold-hi); }
.help { max-width: 62ch; font-size: 15px; line-height: 1.5; }
.help ul { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
kbd { font: 400 13px var(--f-display); background: #fff; color: var(--ink); border: 2px solid var(--ink); border-bottom-width: 4px; border-radius: 6px; padding: 0 5px; white-space: nowrap; }

/* ---------- worker sheet ---------- */
.sheet { position: fixed; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 84px); bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); width: min(380px, calc(100% - 24px));
  display: flex; flex-direction: column; gap: 8px; z-index: 15; padding-bottom: 10px; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 0; }
.sheet-head > img { width: 52px; height: 52px; background: #8fd0ff; border: 3px solid var(--ink); border-radius: 12px; }
.sheet-who { flex: 1; min-width: 0; }
#wp-name { font: 400 22px var(--f-display); }
.sheet-who small { display: block; font-size: 13px; color: var(--mist); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-who small b { color: var(--gold-hi); font-family: var(--f-display); font-weight: 400; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; margin-right: 4px; }
.needs { display: grid; gap: 4px; padding: 0 12px; }
.need { display: grid; grid-template-columns: 20px 58px 1fr; align-items: center; gap: 6px; font-size: 13px; }
.need img { width: 20px; height: 20px; }
.pocket { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 12px; font: 400 15px var(--f-display); text-shadow: 0 2px 0 var(--ink); min-height: 22px; }
.chat { flex: 1; min-height: 60px; overflow: auto; display: flex; flex-direction: column; gap: 6px; padding: 8px; margin: 0 10px; background: rgba(8,16,40,.45); border: 3px solid var(--ink); border-radius: 12px; }
.msg { max-width: 88%; padding: 6px 10px; border-radius: 12px; border: 2px solid var(--ink); font-size: 14px; line-height: 1.3; user-select: text; -webkit-user-select: text; overflow-wrap: anywhere; }
.msg.w { align-self: flex-start; background: #fff; color: var(--ink); border-bottom-left-radius: 4px; }
.msg.you { align-self: flex-end; background: var(--royal-hi); color: #fff; border-bottom-right-radius: 4px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
.msg b { display: block; font: 400 12px var(--f-display); letter-spacing: .04em; color: var(--royal); }
.dots { display: inline-flex; gap: 4px; padding: 4px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--royal); animation: dot 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-4px); opacity: .5; } }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 10px 2px; scrollbar-width: none; }
.chip { flex: none; font: 800 13px ui-monospace, "SF Mono", Menlo, monospace; padding: 5px 9px; border-radius: 999px; border: 2px solid var(--ink); background: #e8efff; color: var(--royal-lo); cursor: pointer; }
.chip.danger { background: #ffd9d4; color: var(--ember-lo); }
.order { display: flex; gap: 6px; padding: 0 10px; }
.order input { flex: 1; min-width: 0; font: 800 16px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 8px 10px; user-select: text; -webkit-user-select: text; }
.ai-tag { padding: 0 12px; font-size: 12px; color: var(--mist); }
.ai-tag[data-state="ready"] { color: var(--leaf-hi); }

/* ---------- pause ---------- */
.pause-card { width: min(380px, 100%); padding: 16px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.pause-card h2 { margin: 0 0 4px; font: 400 30px var(--f-display); }
.pause-card .btn { width: 100%; }
.pause-note { font-size: 13px; color: var(--mist); margin: 0; }

@media (max-width: 719px) {
  .menu-grid { grid-template-columns: 1fr; }
  .sheet { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); height: min(64vh, 540px); }
}
@media (max-width: 560px) {
  .pill { height: 28px; font-size: 15px; min-width: 52px; padding-right: 9px; }
  .pill img { width: 26px; height: 26px; }
  .profile > img { width: 36px; height: 36px; }
  #hud-name { font-size: 15px; }
  .lvl small { display: none; }
  .notice { font-size: 13px; padding: 5px 10px; }
  .notice img { width: 22px; height: 22px; }
  .custom-body { min-height: 0; }
  .hero-stage { height: 150px; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 10px; }
  .quest { max-width: 190px; }
  .q-text { font-size: 12px; }
  .round-btn { width: 66px; height: 66px; }
  .round-btn.blue { width: 58px; height: 58px; }
  .icon-btn { width: 34px; height: 34px; }
  .bar { min-width: 70px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<div id="app">
  <canvas id="view" aria-label="The island"></canvas>
  <div id="overlay" aria-hidden="true"></div>

  <div id="hud" class="hud" hidden>
    <div class="hud-top">
      <div class="hud-left">
        <div class="profile panel">
          <img id="hud-portrait" class="px" alt="">
          <div class="profile-text">
            <div id="hud-name" class="outline-sm">Hero</div>
            <div class="lvl"><img class="px" data-icon="trophy" alt=""><span id="hud-level" class="outline-sm">Bare Isle</span><small id="hud-score"></small></div>
            <div class="bar xp"><i id="hud-xp"></i></div>
          </div>
        </div>
        <div class="hp-row"><img class="px" data-icon="heart" alt=""><div class="bar hp"><i id="hud-hp"></i></div></div>
        <button type="button" id="quest" class="quest" hidden></button>
      </div>
      <div class="hud-right">
        <div class="res-bar" id="res-bar"></div>
        <div class="hud-tools">
          <div id="clock" class="pill clock"></div>
          <button type="button" class="icon-btn" id="btn-zoom-out" aria-label="Zoom out">−</button>
          <button type="button" class="icon-btn" id="btn-zoom-in" aria-label="Zoom in">+</button>
          <button type="button" class="icon-btn" id="btn-pause" aria-label="Menu">≡</button>
        </div>
      </div>
    </div>
    <div id="notices" aria-live="polite"></div>
    <div id="knocked" class="knocked outline" hidden>Knocked out!</div>
    <div id="banner" class="big-banner" hidden></div>
    <div id="placement" class="placement panel" hidden>
      <div id="place-text" class="place-text"></div>
      <div class="place-actions"><button type="button" class="btn red small" id="place-cancel">Cancel</button><button type="button" class="btn green" id="place-ok">Build here</button></div>
    </div>
    <div class="hud-bottom">
      <div id="roster" class="roster"></div>
      <div class="actions">
        <button type="button" id="btn-interact" class="round-btn blue" hidden><img class="px" alt=""><span>Castle</span></button>
        <button type="button" id="btn-attack" class="round-btn" aria-label="Attack"><img class="px" alt=""><span>Attack</span></button>
      </div>
    </div>
  </div>

  <aside id="worker-panel" class="sheet panel" hidden aria-label="Worker orders">
    <div class="sheet-head">
      <img id="wp-portrait" class="px" alt="">
      <div class="sheet-who"><div id="wp-name" class="outline-sm"></div><small><b id="wp-role"></b><span id="wp-state"></span></small></div>
      <button type="button" class="icon-btn" id="wp-close" aria-label="Close">✕</button>
    </div>
    <div class="needs" id="wp-needs"></div>
    <div class="pocket" id="wp-pocket"></div>
    <div class="chat" id="wp-chat" aria-live="polite"></div>
    <div class="chips" id="wp-chips"></div>
    <form class="order" id="wp-form" autocomplete="off">
      <input id="wp-input" type="text" placeholder="/ type an order" aria-label="Order" maxlength="300" enterkeyhint="send">
      <button type="submit" class="btn green">Send</button>
    </form>
    <div class="ai-tag" data-ai-status></div>
  </aside>

  <div id="menu" class="screen" hidden>
    <div class="menu-inner">
      <h1 class="logo"><span class="l0 outline">The Legend of</span><span class="l1">Sephora</span></h1>
      <p class="tagline outline-sm">Build your island. Command an AI crew. Survive the pirates.</p>
      <div class="menu-grid">
        <section class="panel menu-card">
          <h2 class="card-head outline-sm">Your hero</h2>
          <div class="hero-stage"><canvas id="preview" width="192" height="150"></canvas></div>
          <div class="row">
            <label class="field-label outline-sm" for="hero-name">Name</label>
            <input id="hero-name" class="text-input" maxlength="16" autocomplete="off">
          </div>
          <div class="row"><button type="button" class="btn blue small" id="btn-turn">Turn around</button><button type="button" class="btn blue small" id="btn-random">Random look</button></div>
        </section>
        <section class="panel menu-card">
          <h2 class="card-head outline-sm">Customize</h2>
          <div>
            <nav class="tabs" id="menu-tabs" style="padding:0"></nav>
            <div class="custom-body" id="menu-options"></div>
          </div>
        </section>
      </div>
      <div class="menu-actions">
        <span class="seed"><span id="seed-label">Island</span><button type="button" class="icon-btn" id="btn-reroll" aria-label="New random island">↻</button></span>
        <button type="button" class="btn blue" id="btn-howto-menu">How to play</button>
        <button type="button" class="btn gold big continue" id="btn-continue" hidden>Continue<small id="continue-sub"></small></button>
        <button type="button" class="btn green big" id="btn-play">New island</button>
      </div>
      <div id="confirm-new" class="panel confirm" hidden>
        <span>Start a new island? Your saved island will be replaced.</span>
        <button type="button" class="btn red small" id="btn-confirm-new">Start new</button>
        <button type="button" class="btn blue small" id="btn-cancel-new">Keep my island</button>
      </div>
      <p class="ai-line" data-ai-status></p>
    </div>
  </div>

  <div id="modal-wrap" class="modal-wrap" hidden><div id="modal" class="modal panel" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div></div>

  <div id="pause" class="modal-wrap" hidden>
    <div class="panel pause-card" role="dialog" aria-modal="true" aria-label="Menu">
      <h2 class="outline">Paused</h2>
      <button type="button" class="btn green" data-p="resume">Resume</button>
      <button type="button" class="btn blue" data-p="help">How to play</button>
      <button type="button" class="btn blue" data-p="save">Save now</button>
      <button type="button" class="btn gold" data-p="exit">Save and exit to menu</button>
      <button type="button" class="btn red" data-p="new">Start a new island</button>
      <div id="pause-confirm" class="confirm" hidden>
        <span>This deletes your current island.</span>
        <button type="button" class="btn red small" data-p="new-yes">Delete and start over</button>
        <button type="button" class="btn blue small" data-p="new-no">Keep it</button>
      </div>
      <p class="pause-note" data-ai-status></p>
      <p class="pause-note" id="cloud-status"></p>
    </div>
  </div>
</div>
